services:
  mysql:
    image: mysql:latest
    container_name: my-magic-db
    environment:
      - "MYSQL_DATABASE=${DB_NAME}"
      - "MYSQL_USER=${DB_USER}"
      - "MYSQL_PASSWORD=${DB_PASSWORD}"
      - "MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}"
    ports:
      - "3307:3306"

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

  # Kafka 브로커 (메시지를 저장하고 전달하는 서버)
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    # 도커 네트워크 안에서 다른 컨테이너가 'kafka'라는 이름으로 접속할 수 있게 함
    hostname: kafka
    ports:
      # 9092: 호스트(맥북)에서 Kafka 접속용. Spring 앱이 localhost:9092로 접속
      - "9092:9092"
    environment:
      # ===== KRaft 모드 설정 =====
      # 예전엔 Kafka 띄우려면 Zookeeper도 같이 띄워야 했는데,
      # 요즘은 KRaft 모드로 Kafka 혼자서 처리 가능 (구성이 훨씬 단순)

      # 노드 ID. 클러스터 내에서 이 브로커를 식별하는 번호 (단일 노드라 1)
      KAFKA_NODE_ID: 1

      # 이 노드가 수행할 역할. 단일 브로커라 브로커 + 컨트롤러 둘 다 겸함
      KAFKA_PROCESS_ROLES: broker,controller

      # ===== 리스너(통신 경로) 설정 =====
      # 리스너 3개를 쓰는 이유 = "누가 어떤 경로로 접속하느냐"가 다르기 때문
      #  - PLAINTEXT      (29092): 도커 네트워크 안의 다른 컨테이너가 Kafka 접속용 (예: kafka-ui)
      #  - CONTROLLER     (29093): KRaft 컨트롤러끼리 내부 통신용
      #  - PLAINTEXT_HOST (9092):  호스트(맥북)에서 접속용. Spring 앱이 여기로 접속
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092

      # 클라이언트가 Kafka에 처음 접속하면, Kafka가 "나한테 접속하려면 이 주소로 와" 라고 알려줌
      # → 도커 내부에서 접속한 클라이언트면 'kafka:29092' 안내
      # → 호스트에서 접속한 클라이언트면 'localhost:9092' 안내
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      # 각 리스너가 어떤 보안 프로토콜을 쓸지 (전부 평문 = 암호화 X, 로컬 개발용)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT

      # 브로커끼리 통신할 때 어떤 리스너 쓸지 (단일 노드라 큰 의미 없지만 필수 설정)
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # 컨트롤러 역할로 쓸 리스너 이름
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # 컨트롤러 투표(Quorum) 멤버. 단일 노드라 자기 자신만 (1번 노드, 29093 포트)
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      # 단일 노드 환경이라 복제본 수 = 1 (기본값은 3, 노드 부족하면 에러)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Consumer 그룹 첫 합류 시 대기시간 (개발용으로 0 — 빠르게 시작)
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Kafka 데이터 저장 경로 (컨테이너 내부)
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

      # 클러스터 식별자 (랜덤 문자열, 그냥 이대로 써도 됨)
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  # Kafka GUI (디버깅용 - 토픽/메시지를 브라우저에서 확인)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      # 8081: Spring 앱이 8080 쓰니까 충돌 피해서 8081
      - "8081:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      # 도커 네트워크 안 통신이라 'kafka:29092' (호스트용 9092 아님)
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
    depends_on:
      # kafka가 먼저 떠야 kafka-ui가 뜸
      - kafka