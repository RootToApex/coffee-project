services:
  mysql:
    image: mysql:latest
    container_name: my-magic-db
    environment:
      - "MYSQL_DATABASE=${DB_NAME}"
      - "MYSQL_USER=${DB_USER}"
      - "MYSQL_PASSWORD=${DB_PASSWORD}"
      - "MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}"
    ports:
      - "3307:3306"
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"