spring:
  datasource:
    url: jdbc:mysql://localhost:3307/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show-sql: true
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379